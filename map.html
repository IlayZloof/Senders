<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>מפה — Senders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="map-page">
  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo">SEND<span>ERS</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="תפריט מידע">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links nav-links-primary" id="navLinksPrimary">
      <li><a href="index.html">בית</a></li>
      <li><a href="map.html">מפה</a></li>
      <li><a href="community.html">קהילה</a></li>
      <li><a href="add-spot.html">הוספת ספוט</a></li>
      <li><a href="profile.html">פרופיל</a></li>
    </ul>
    <ul class="nav-links nav-links-info" id="navLinks">
      <li><a href="about.html">קצת עליי</a></li>
      <li><a href="safety.html">בטיחות</a></li>
      <li><a href="faq.html">שאלות נפוצות</a></li>
      <li><a href="terms.html">תנאי שימוש</a></li>
      <li><a href="privacy.html">מדיניות פרטיות</a></li>
      <li><a href="contact.html">צור קשר</a></li>
    </ul>
    <div class="nav-auth" id="authArea"></div>
  </nav>

  <div class="guest-banner" id="guestBanner" hidden></div>

  <main>
    <section class="page-hero map-page-hero">
      <div class="container">
        <h1 class="page-title map-page-title">מפת הקפיצות של ישראל</h1>
        <div class="map-legend">
          <span><i style="background:#38bdf8"></i> עד 8מ׳</span>
          <span><i style="background:#f97316"></i> 10–15מ׳</span>
          <span><i style="background:#ef4444"></i> מעל 15מ׳</span>
          <span><i style="background:#1e293b"></i> מעל 20מ׳</span>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top: 0">
      <div class="container">
        <div class="map-layout">
          <div class="map-container" id="mainMap"></div>
          <div class="map-sidebar">
            <input type="search" id="mapSearch" class="map-search" placeholder="חיפוש לפי שם..." dir="rtl" />
            <div class="filter-bar" id="mapFilters">
              <button class="filter-btn active" data-filter="all">הכל</button>
              <button class="filter-btn" data-filter="north">צפון</button>
              <button class="filter-btn" data-filter="center">מרכז</button>
              <button class="filter-btn" data-filter="south">דרום</button>
            </div>
            <div class="filter-bar" id="heightFilters">
              <button class="filter-btn active" data-height="all">כל הגבהים</button>
              <button class="filter-btn" data-height="0-5">עד 5מ׳</button>
              <button class="filter-btn" data-height="5-10">5–10מ׳</button>
              <button class="filter-btn" data-height="10-15">10–15מ׳</button>
              <button class="filter-btn" data-height="15+">15מ׳+</button>
            </div>
            <div class="filter-bar">
              <button type="button" class="filter-btn" id="favFilterBtn">♥ מועדפים</button>
            </div>
            <div class="map-spot-list" id="mapSpotList"></div>
            <a href="add-spot.html" class="btn btn-primary btn-full">+ הוספת ספוט</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="siteFooter"></footer>

  <script type="module">
    import { initNav, showGuestBanner } from './js/ui.js';
    import { initMap } from './js/map.js';

    initNav();
    showGuestBanner();

    initMap('mainMap', {
      showList: true,
      listContainerId: 'mapSpotList',
      filterContainerId: 'mapFilters',
      heightFilterContainerId: 'heightFilters',
      searchInputId: 'mapSearch',
      favFilterId: 'favFilterBtn',
    });
  </script>
</body>
</html>
