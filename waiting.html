<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>html,body{background:#071824;color:#e8e4d9}html[data-theme="light"],html[data-theme="light"] body{background:#e8e4d9;color:#071824}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="theme-color" content="#071824" />
  <script>
    (function () {
      var KEY = 'senders-theme';
      var mode = 'dark';
      try { mode = localStorage.getItem(KEY) || 'dark'; } catch (e0) {}
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light' || q === 'dark' || q === 'auto') {
          localStorage.setItem(KEY, q);
          mode = q;
        }
      } catch (e) {}
      if (mode !== 'light' && mode !== 'auto') mode = 'dark';
      function resolved() {
        if (mode === 'auto') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return mode;
      }
      var theme = resolved();
      var root = document.documentElement;
      var lang = 'he';
      try {
        lang = localStorage.getItem('senders-lang') === 'en' ? 'en' : 'he';
      } catch (e2) {}
      root.setAttribute('lang', lang);
      root.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
      root.setAttribute('data-lang', lang);
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-theme-mode', mode);
      root.classList.add('access-open');
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#e8e4d9' : '#071824');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>ממתין לאישור — Senders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
  <!-- Fonts must never block first paint (a stalled fonts request = white screen on iPhone). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;500;600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ops-theme.css" />
  <link rel="stylesheet" href="theme-atlas.css" />
</head>
<body class="login-page theme-atlas">
  <nav class="nav" id="nav">
    <a href="waiting.html" class="nav-logo">SEND<span>ERS</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="תפריט מידע">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links nav-links-primary" id="navLinksPrimary"></ul>
    <ul class="nav-links nav-links-info" id="navLinks">
      <li><a href="about.html">קצת עליי</a></li>
      <li><a href="safety.html">בטיחות</a></li>
      <li><a href="faq.html">שאלות נפוצות</a></li>
      <li><a href="terms.html">תנאי שימוש</a></li>
      <li><a href="privacy.html">מדיניות פרטיות</a></li>
      <li><a href="contact.html">צור קשר</a></li>
    </ul>
    <div class="nav-auth" id="authArea"></div>
  </nav>

  <main>
    <section class="section" style="padding-top: calc(var(--content-top) + 3rem)">
      <div class="container">
        <div class="auth-card" style="text-align: center">
          <h1 class="page-title" data-i18n="wait.title">ממתין לאישור כניסה לאתר</h1>
          <p class="page-desc" data-i18n="wait.lead">קיבלנו את הבקשה. ברגע שהחשבון יופעל אפשר להיכנס.</p>
          <button type="button" class="btn btn-ghost" id="waitLogout" data-i18n="wait.logout">התנתקות</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initNav } from './js/ui.js';
    import { getSession, signOut, hasApprovedAccess, isWaitingAccess, isAdmin } from './js/store.js';

    initNav();

    function routeFromSession(session) {
      if (!session) {
        window.location.replace('login.html');
        return;
      }
      if (isAdmin(session.profile, session.user) || hasApprovedAccess(session.profile, session.user)) {
        window.location.replace('index.html');
        return;
      }
      if (!isWaitingAccess(session.profile, session.user)) {
        window.location.replace('login.html');
      }
    }

    function check() {
      getSession().then(routeFromSession).catch(() => {
        window.location.replace('login.html');
      });
    }

    check();
    window.setInterval(check, 4000);

    document.getElementById('waitLogout')?.addEventListener('click', () => {
      signOut().finally(() => {
        window.location.replace('login.html');
      });
    });
  </script>
  <script type="module" src="/js/version.js"></script>
  <script>
    /* Boot failsafe: if the app has not finished starting after 6s (script
       blocked, network stall, unexpected error), show a reload option instead
       of an empty screen. Access control is unchanged (gate stays; RLS rules). */
    (function () {
      setTimeout(function () {
        if (window.__sendersBooted || document.getElementById('bootFailsafe')) return;
        var box = document.createElement('div');
        box.id = 'bootFailsafe';
        box.setAttribute('role', 'alert');
        box.dir = 'rtl';
        box.style.cssText = 'position:fixed;inset:auto 12px 24px 12px;z-index:2147483647;padding:16px;border-radius:14px;background:#171f28;color:#e8eef3;font:15px/1.5 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(232,238,243,.15)';
        box.innerHTML = '<p style="margin:0 0 12px">הטעינה לוקחת יותר מדי זמן.</p>'
          + '<button type="button" style="font:inherit;padding:8px 18px;border:0;border-radius:999px;background:#c4a35a;color:#14110b;font-weight:600">טעינה מחדש</button>'
          + ' <a href="/login.html" style="color:#c4a35a;margin-inline-start:12px">להתחברות</a>';
        box.querySelector('button').onclick = function () { location.reload(); };
        (document.body || document.documentElement).appendChild(box);
      }, 6000);
    })();
  </script>
</body>
</html>
