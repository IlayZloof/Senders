name: Deploy to Cloudflare (senders-ops)

# Production deploy: every push to main (i.e. "promote" = merge dev -> main)
# builds the site and deploys the senders-ops Worker. Can also be run by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://senders-ops.ilay-zloof.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env.local from repo secrets (public values only)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_ADMIN_EMAIL; do
            if [ -z "${!v}" ]; then echo "::error::Missing repo secret $v"; exit 1; fi
          done
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_ADMIN_EMAIL=$VITE_ADMIN_EMAIL"
          } > .env.local

      - name: Build (vite build)
        run: npm run build

      - name: Show version being deployed
        run: cat dist/version.json

      # Build already happened above; deploy only uploads dist/ + worker.js
      # (do NOT use `npm run deploy`, which would build again).
      - name: Deploy Worker senders-ops
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc --no-autoconfig
