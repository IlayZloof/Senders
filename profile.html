<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>פרופיל — Senders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo">SEND<span>ERS</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="תפריט מידע">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links nav-links-primary" id="navLinksPrimary">
      <li><a href="index.html">בית</a></li>
      <li><a href="map.html">מפה</a></li>
      <li><a href="community.html">קהילה</a></li>
      <li><a href="add-spot.html">הוספת ספוט</a></li>
      <li><a href="profile.html">פרופיל</a></li>
    </ul>
    <ul class="nav-links nav-links-info" id="navLinks">
      <li><a href="about.html">קצת עליי</a></li>
      <li><a href="safety.html">בטיחות</a></li>
      <li><a href="faq.html">שאלות נפוצות</a></li>
      <li><a href="terms.html">תנאי שימוש</a></li>
      <li><a href="privacy.html">מדיניות פרטיות</a></li>
      <li><a href="contact.html">צור קשר</a></li>
    </ul>
    <div class="nav-auth" id="authArea"></div>
  </nav>

  <main>
    <section class="section" style="padding-top: calc(var(--content-top) + 2rem)">
      <div class="container" id="profileContent">
        <p>טוען...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initNav, formatDate, heightLabel } from './js/ui.js';
    import { getSession, getJumps, getUserVisits, isAdmin, getFavoriteSpots } from './js/store.js';

    initNav();

    const params = new URLSearchParams(window.location.search);
    const viewUserId = params.get('user');

    async function renderProfile() {
      const session = await getSession();
      const userId = viewUserId || session?.user?.id;

      const favorites = await getFavoriteSpots();

      if (!userId) {
        document.getElementById('profileContent').innerHTML = `
          <div class="login-locked" style="max-width: 400px; margin: 2rem auto">
            <p>התחברו כדי לראות את הפרופיל שלכם.</p>
            <a href="login.html?redirect=profile.html">התחברות</a>
            <p style="margin-top: 1rem"><a href="map.html">או המשיכו לצפות בספוטים →</a></p>
          </div>
          ${favorites.length ? `
            <div class="profile-section" style="max-width: 640px; margin: 2rem auto">
              <h2>מועדפים במכשיר</h2>
              ${favorites.map((v) => `
                <a href="spot.html?id=${v.id}" class="visit-item">
                  <div>
                    <strong>${v.name}</strong>
                    <span>${heightLabel(v)}</span>
                  </div>
                  <span>→</span>
                </a>
              `).join('')}
            </div>
          ` : ''}
        `;
        return;
      }

      const profile = session?.profile || (await import('./js/store.js').then((m) => m.getProfile(userId)));
      const jumps = await getJumps(userId);
      const visits = await getUserVisits(userId);
      const isOwn = session?.user?.id === userId;
      const maxHeight = jumps.length ? Math.max(...jumps.map((j) => j.height || 0)) : 0;

      document.title = `${profile?.display_name || 'פרופיל'} — Senders`;

      document.getElementById('profileContent').innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar"><img src="/icons/avatar-default.svg" alt=""></div>
          <div>
            <div class="profile-name">
              ${profile?.display_name || 'משתמש'}
              ${isAdmin(profile) ? '<span class="admin-badge">מנהל</span>' : ''}
            </div>
            <div class="profile-meta">
              חבר/ה מאז ${profile?.created_at ? formatDate(profile.created_at) : 'היום'}
              ${isOwn ? ' · <a href="login.html" style="color: var(--accent-dark)">החשבון שלי</a>' : ''}
            </div>
          </div>
        </div>

        <div class="profile-stats">
          <div class="stat-card">
            <span class="num">${jumps.length}</span>
            <span class="label">קפיצות</span>
          </div>
          <div class="stat-card">
            <span class="num">${visits.length}</span>
            <span class="label">מקומות</span>
          </div>
          <div class="stat-card">
            <span class="num">${maxHeight || '—'}</span>
            <span class="label">שיא גובה (מ׳)</span>
          </div>
          ${isOwn ? `
          <div class="stat-card">
            <span class="num">${favorites.length}</span>
            <span class="label">מועדפים</span>
          </div>
          ` : ''}
        </div>

        ${isOwn && isAdmin(profile, session?.user) ? `
        <div class="profile-section" style="margin-bottom: 2rem">
          <a href="admin.html" class="btn btn-primary">ספוטים ממתינים לאישור</a>
        </div>
        ` : ''}

        ${isOwn ? `
        <div class="profile-section" style="margin-bottom: 2rem">
          <a href="index.html?upload=1" class="btn btn-primary">העלה סרטון</a>
        </div>
        <div class="profile-section" style="margin-bottom: 2rem">
          <h2>מועדפים</h2>
          ${favorites.length ? favorites.map((v) => `
            <a href="spot.html?id=${v.id}" class="visit-item">
              <div>
                <strong>${v.name}</strong>
                <span>${heightLabel(v)}</span>
              </div>
              <span>→</span>
            </a>
          `).join('') : '<p style="color: var(--text-muted)">עדיין אין מועדפים. לחצו ♡ על ספוט במפה.</p>'}
        </div>
        ` : ''}

        <div class="profile-section" style="margin-bottom: 2rem">
          <h2>היסטוריית קפיצות</h2>
          ${jumps.length ? jumps.map((j) => `
            <div class="jump-item">
              <div>
                <strong>${j.spots?.name || 'ספוט'}</strong>
                <span>${j.height}מ׳ · ${formatDate(j.jumped_at)}</span>
              </div>
              <a href="spot.html?id=${j.spot_id}" class="btn btn-ghost btn-sm">צפייה</a>
            </div>
          `).join('') : '<p style="color: var(--text-muted)">עדיין אין קפיצות רשומות.</p>'}
        </div>

        <div class="profile-section">
          <h2>מקומות שביקרתי</h2>
          ${visits.length ? visits.map((v) => `
            <a href="spot.html?id=${v.id}" class="visit-item">
              <div>
                <strong>${v.name}</strong>
                <span>${heightLabel(v)}</span>
              </div>
              <span>→</span>
            </a>
          `).join('') : '<p style="color: var(--text-muted)">עדיין אין ביקורים.</p>'}
        </div>
      `;
    }

    renderProfile();
  </script>
</body>
</html>
